name: Build GeoIP Extension

# 编译 SourceMod GeoIP 扩展（含 PR #2335 中文语言码修复），产出 1.11 / 1.12 平台、
# Linux / Windows 两个系统的 geoip.ext.so / geoip.ext.dll。
#
# 背景：GeoIP 是 SourceMod 的 in-tree 扩展（引用 SourceMod 自身构建系统与 public/ 头文件），
# 无法脱离 SourceMod 源码树独立编译。因此本工作流按矩阵分别拉取 SourceMod 的
# 1.11-dev / 1.12-dev 分支，把 extensions/geoip/ 同步进去后用官方 AMBuild 流程编译，
# 从而保证同一份扩展源码在各平台上都产出正确的二进制。
#
# 打 v* 标签（如 v1.0.0）时额外创建一个 Release，把各平台产物作为附件发布。

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 默认只读；发布 job 单独申请 contents: write
permissions:
  contents: read

# 同一分支的重复触发自动取消旧任务（保留 tag / 手动触发）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.os_name }} / SourceMod ${{ matrix.sm_branch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux（官方服务端主力平台）----
          - runner: ubuntu-22.04
            os_name: linux
            os_short: linux
            sm_branch: '1.11-dev'
            ext: so
            cc: clang-14
            cxx: clang++-14
          - runner: ubuntu-22.04
            os_name: linux
            os_short: linux
            sm_branch: '1.12-dev'
            ext: so
            cc: clang-14
            cxx: clang++-14
          # ---- Windows ----
          # 不设 CC/CXX：交给 AMBuild 自动探测 MSVC
          - runner: windows-2022
            os_name: windows
            os_short: windows
            sm_branch: '1.11-dev'
            ext: dll
          - runner: windows-2022
            os_name: windows
            os_short: windows
            sm_branch: '1.12-dev'
            ext: dll

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout extension source
        uses: actions/checkout@v4

      # 全局 autocrlf=true 会让 git 在操作工作区时改动行尾，破坏与上游的逐字节比对。
      # 本仓库靠 .gitattributes 精确控制行尾，这里显式关闭全局设置。
      - name: Configure git line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # ---------- Linux 工具链 ----------
      # 依赖清单对齐 SourceMod 官方 PR 检查（pr-checks.yml 在 ubuntu-22.04 上用 clang-14）：
      # 目标是 x86，64 位宿主必须有 i386 的 multilib 开发库，否则 32 位链接会失败。
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang-14 build-essential gcc-multilib g++-multilib \
            libstdc++6 lib32stdc++6 libc6-dev libc6-dev-i386 \
            linux-libc-dev linux-libc-dev:i386 lib32z1-dev \
            patch zip file python3 python3-pip python3-venv

      # ---------- Windows 工具链 ----------
      # windows-2022 装了 VS Enterprise 2022，但 cl.exe 默认不在 PATH 上，
      # AMBuild 的 DetectCxx 会因此报 "Unable to find a suitable C compiler"
      # （日志里 msvc 探测的命令是 ['test.c', ...]，编译器名是空的）。
      # 这里用 vswhere + vcvarsall x86 加载 VS 开发者环境，再导出到后续步骤。
      # 目标架构是 x86（32 位），所以传 x86 而不是 amd64。
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "找不到 vswhere.exe：$vswhere" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'vswhere 未找到带 C++ 工具集的 VS 安装' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path $vcvars)) { throw "找不到 vcvarsall.bat：$vcvars" }
          Write-Host "VS: $vs"

          # 让 cmd 执行 vcvarsall 后把所有环境变量 dump 成 "名=值" 行。
          # chcp 65001 避免 VS 路径里的非 ASCII 字符把输出编码搞乱。
          $tmp = Join-Path $env:RUNNER_TEMP 'msvc-env'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $bat = Join-Path $tmp 'dump.bat'
          $out = Join-Path $tmp 'env.txt'
          $lines = @(
            '@echo off'
            'chcp 65001 >nul'
            'call "' + $vcvars + '" x86 >nul'
            'set'
          )
          # .bat 需要 CRLF
          [System.IO.File]::WriteAllText($bat, ($lines -join "`r`n") + "`r`n",
            (New-Object System.Text.ASCIIEncoding))

          # 必须用 Start-Process -Wait：`cmd /c "... > file"` 返回时重定向的文件句柄
          # 可能还没释放，紧接着读会报 "being used by another process"。
          # -Wait 会等到进程真正退出（stderr 合并进 stdout，避免警告污染解析）。
          $p = Start-Process -FilePath 'cmd.exe' `
                 -ArgumentList '/c', "`"$bat`"", '2>&1' `
                 -RedirectStandardOutput $out -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "vcvarsall 批处理退出码 $($p.ExitCode)" }
          if (-not (Test-Path $out)) { throw 'vcvarsall 未产出环境变量' }

          # 保险：即便进程已退出，文件偶尔仍会短暂被占用，重试若干次
          $text = $null
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $text = [System.IO.File]::ReadAllText($out, [System.Text.Encoding]::UTF8)
              break
            } catch [System.IO.IOException] {
              Start-Sleep -Milliseconds 200
            }
          }
          if ($null -eq $text) { throw "无法读取 $out（一直处于占用状态）" }

          # 写 $GITHUB_ENV 必须用无 BOM 的 UTF-8：
          # Windows PowerShell 5.1 的 `Out-File -Encoding utf8` 会写入 BOM(EF BB BF)，
          # 那会污染 GITHUB_ENV 的第一行，导致第一个变量（通常是 PATH 相关）失效。
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $count = 0
          foreach ($line in ($text -split "`r?`n")) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            # 值里若含换行会破坏 GITHUB_ENV 的 "名=值" 格式，直接跳过
            if ($Matches[1] -match "[`r`n]" -or $Matches[2] -match "[`r`n]") { continue }
            [System.IO.File]::AppendAllText($env:GITHUB_ENV,
              "$($Matches[1])=$($Matches[2])`n", $utf8NoBom)
            $count++
          }
          Write-Host "已从 vcvarsall 载入 $count 个环境变量"

      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "cl.exe : $(command -v cl || echo 未在 PATH)"
          echo "link   : $(command -v link || echo 未在 PATH)"
          # vcvarsall 若未生效，AMBuild 会报 "Unable to find a suitable C compiler"
          command -v cl >/dev/null 2>&1 || { echo "::error::cl.exe 不在 PATH，MSVC 环境未生效"; exit 1; }
          python -c "import sys; print('python', sys.version)"
          command -v patch >/dev/null 2>&1 && echo "patch: $(command -v patch)" || echo "patch 缺失（将回退到 git apply）"
          command -v zip   >/dev/null 2>&1 && echo "zip: $(command -v zip)"     || echo "zip 缺失（将回退到 tar）"

      - name: Install AMBuild
        shell: bash
        run: |
          set -euo pipefail
          # 选一个能真正执行 python 的解释器（Windows 上 WindowsApps 的 python3
          # 是 Store 存根，可能不可用，因此优先 python）
          PY=python
          if ! "$PY" -c "import sys" >/dev/null 2>&1; then
            PY=python3
          fi
          "$PY" -c "import sys; print('using', sys.executable, sys.version.split()[0])"

          VENV="$HOME/ambuild-venv"
          rm -rf "$VENV"
          "$PY" -m venv "$VENV"

          # venv 的布局随平台不同（Linux: bin/，Windows: Scripts/），且 MSYS 下
          # bin/python 可能只是转发脚本。以“能真正执行”为准来选，而不是只看存在。
          VENV_PY=""
          for cand in "$VENV/bin" "$VENV/Scripts"; do
            for exe in "$cand/python" "$cand/python.exe"; do
              if [ -x "$exe" ] && "$exe" -c "import sys" >/dev/null 2>&1; then
                VENV_PY="$exe"
                break 2
              fi
            done
          done
          [ -n "$VENV_PY" ] || { echo "::error::无法在 $VENV 中定位可用的 python 解释器"; ls -1 "$VENV"; exit 1; }
          echo "venv python: $VENV_PY"
          "$VENV_PY" -c "import sys; print('venv version:', sys.version.split()[0])"

          # 注意：不要把 pip 和 setuptools/wheel 放在同一次升级里。
          # 新版 pip（windows-2022 上是 26.x）会拒绝修改自身并直接报错：
          #   ERROR: To modify pip, please run the following command: ...
          # 因此这里只装构建所需的 setuptools/wheel，不升级 pip
          # （venv 自带的 pip 足够安装 AMBuild）。
          "$VENV_PY" -m pip install --quiet --upgrade setuptools wheel
          "$VENV_PY" -m pip install --quiet "git+https://github.com/alliedmodders/ambuild.git"

          # PATH 必须在这里写入，后续步骤才拿得到（GITHUB_PATH 只对之后的步骤生效）
          echo "$(dirname "$VENV_PY")" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "os      : ${{ runner.os }}"
          echo "python  : $(python --version 2>&1)"
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "clang++ : $(clang++ --version | head -n 1)"
            # 确认能链接 32 位（SourceMod 服务端是 x86）
            echo 'int main(){return 0;}' > /tmp/t32.c
            clang++ -m32 /tmp/t32.c -o /tmp/t32 \
              || { echo "::error::无法编译 32 位程序，缺少 multilib（i386）开发库"; exit 1; }
            file /tmp/t32
            echo "ok: 32 位工具链可用"
          fi
          for t in patch python ambuild; do
            command -v "$t" >/dev/null 2>&1 || { echo "::error::工具链缺少 $t"; exit 1; }
          done

      - name: Checkout SourceMod (${{ matrix.sm_branch }})
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.sm_branch }}
          path: sm
          # submodule 必须拉取：public/amtl（其仓库内还有一层 amtl/）、sourcepawn、
          # public/safetyhook（仅 1.12 有）、versionlib、hl2sdk-manifests 等
          submodules: recursive

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ matrix.os_short }}-${{ matrix.sm_branch }}-${{ hashFiles('sm/tools/checkout-deps.sh') }}
          restore-keys: |
            deps-${{ matrix.os_short }}-${{ matrix.sm_branch }}-

      - name: Show SourceMod revision
        shell: bash
        run: |
          echo "SourceMod product.version: $(tr -d '\n' < sm/product.version)"
          git -C sm log -1 --format='commit %h  %ad  %s' --date=short

      - name: Build GeoIP extension
        shell: bash
        # 脚本会：核验 PR #2335 中文修复 -> 同步扩展源码 -> 裁剪构建列表为只构建 geoip
        #        -> 克隆 Metamod:Source（正确分支）+ mock SDK
        #        -> configure.py --sdks=present --no-mysql --targets=x86 -> ambuild
        run: |
          chmod +x tools/build-geoip.sh
          ./tools/build-geoip.sh --sourcemod "$PWD/sm" --deps "$PWD/deps" --out "$PWD/out"

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          SO="out/package/addons/sourcemod/extensions/geoip.ext.${{ matrix.ext }}"
          [ -f "$SO" ] || { echo "::error::$SO 不存在，构建未产出二进制"; exit 1; }
          echo "size : $(stat -c%s "$SO" 2>/dev/null || stat -f%z "$SO") bytes"
          file "$SO" 2>/dev/null || true

          if [ "${{ matrix.ext }}" = "so" ]; then
            head -c 4 "$SO" | od -An -tx1 | tr -d ' \n' | grep -qi '^7f454c46' \
              || { echo "::error::$SO 不是 ELF 文件"; exit 1; }
            file "$SO" | grep -q 'ELF 32-bit LSB shared object' \
              || { echo "::error::$SO 不是 32 位 ELF 共享对象"; exit 1; }
          else
            # Windows PE 校验：MZ 头、e_lfanew(0x3C) 处的 PE\0\0 签名、
            # 以及可选头魔数 0x10b（PE32，32 位）。
            # 注意不能只 grep 'PE'——那个签名太短，几乎任何文件都能命中。
            # 全程用 od/awk，不依赖 file(1) 是否存在。
            head -c 2 "$SO" | od -An -tx1 | tr -d ' \n' | grep -qi '^4d5a' \
              || { echo "::error::$SO 不是 PE 文件（缺 MZ 头）"; exit 1; }

            e_lfanew=$(od -An -tu4 -j60 -N4 "$SO" | tr -d ' \n')
            [ -n "$e_lfanew" ] || { echo "::error::读取 e_lfanew 失败"; exit 1; }
            sig=$(od -An -c -j"$e_lfanew" -N4 "$SO" | tr -d ' \n')
            [ "$sig" = "PE\\0\\0" ] || { echo "::error::0x$e_lfanew 处没有 PE\\0\\0 签名（实际 '$sig'）"; exit 1; }

            magic=$(od -An -tx1 -j$((e_lfanew + 24)) -N2 "$SO" | tr -d ' \n')
            [ "$magic" = "0b01" ] \
              || { echo "::error::可选头魔数为 $magic，期望 0b01（32 位 PE32）—— --targets 是否被覆盖？"; exit 1; }
            echo "PE ok: e_lfanew=0x$e_lfanew, 可选头魔数=0x$magic (PE32 / 32 位)"
          fi

          # 扩展元信息（SMEXT_CONF_NAME "GeoIP"）
          grep -aq 'GeoIP' "$SO" || { echo "::error::二进制中未找到 GeoIP 标识"; exit 1; }
          echo "ok: geoip.ext.${{ matrix.ext }} 校验通过"

      - name: Verify PR #2335 Chinese fix is compiled in
        shell: bash
        # 本仓库的存在意义就是带上这个修复：产物必须能证明它确实被编进去了
        run: |
          set -euo pipefail
          echo "--- 构建所用源码中的修复 ---"
          grep -n 'strcmp(code, "chi")' sm/extensions/geoip/geoip_util.cpp \
            || { echo "::error::构建用的源码缺少 PR #2335 修复"; exit 1; }
          grep -n 'code = "zh-CN";' sm/extensions/geoip/geoip_util.cpp \
            || { echo "::error::构建用的源码缺少 zh-CN 归一化赋值"; exit 1; }

          echo "--- 产物中的字符串 ---"
          SO="out/package/addons/sourcemod/extensions/geoip.ext.${{ matrix.ext }}"
          if grep -aq 'zh-CN' "$SO"; then
            echo "ok: 二进制内含 zh-CN（修复已编入）"
          else
            echo "::error::二进制内未找到 zh-CN，中文修复可能没被编进去"; exit 1
          fi

      - name: Package extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          NAME="geoip-ext-${{ matrix.sm_branch }}-${{ matrix.os_short }}"
          cd out/package
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Git for Windows 自带 tar（bsdtar，支持 zip）
            tar -a -c -f "$GITHUB_WORKSPACE/dist/$NAME.zip" addons
          else
            zip -r9 "$GITHUB_WORKSPACE/dist/$NAME.zip" addons
          fi
          cd "$GITHUB_WORKSPACE"
          ls -lh dist
          sha256sum "dist/$NAME.zip" 2>/dev/null | tee "dist/$NAME.zip.sha256" || \
            shasum -a 256 "dist/$NAME.zip" | tee "dist/$NAME.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geoip-ext-${{ matrix.sm_branch }}-${{ matrix.os_short }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os_name }} / SourceMod ${{ matrix.sm_branch }}"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| runner | ${{ matrix.runner }} |"
            echo "| python | $(python --version 2>&1) |"
            echo "| SourceMod | $(tr -d '\n' < sm/product.version 2>/dev/null || echo 'n/a') |"
            echo "| PR #2335 修复标记 | $(grep -c 'strcmp(code, \"chi\")' sm/extensions/geoip/geoip_util.cpp 2>/dev/null || echo 0) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 发布：仅在推送 v* 标签时执行
  # 把各平台产物合并成「每个 SourceMod 版本一个包」（含 .so 与 .dll），
  # 附到同一个 Release 上。
  # ------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        shell: bash
        run: find artifacts -type f | sort

      - name: Assemble per-SourceMod-version packages
        shell: bash
        run: |
          set -euo pipefail
          # 需要 unzip/zip；ubuntu runner 自带，缺了则补装
          if ! command -v unzip >/dev/null 2>&1 || ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq unzip zip
          fi

          mkdir -p release

          for sm in 1.11-dev 1.12-dev; do
            stage="stage/$sm"
            mkdir -p "$stage/addons/sourcemod/extensions"

            found=0
            for os in linux windows; do
              for f in artifacts/geoip-ext-$sm-$os/*.zip; do
                [ -f "$f" ] || continue
                # 从各平台包里取出扩展二进制，合并到同一个包
                tmp="unpack/$sm-$os"
                mkdir -p "$tmp"
                unzip -q -o "$f" -d "$tmp"
                for bin in "$tmp"/addons/sourcemod/extensions/*; do
                  [ -f "$bin" ] || continue
                  cp -f "$bin" "$stage/addons/sourcemod/extensions/"
                  echo "  + $sm: $(basename "$bin")"
                  found=1
                done
              done
            done

            if [ "$found" -eq 0 ]; then
              echo "::error::$sm 没有任何产物"
              exit 1
            fi

            ( cd "$stage" && zip -r9 "$GITHUB_WORKSPACE/release/geoip-ext-$sm.zip" addons )
          done

          cd release
          sha256sum *.zip > SHA256SUMS.txt
          echo "--- release 资产 ---"
          ls -lh
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            SourceMod GeoIP 扩展，**包含 [PR #2335](https://github.com/alliedmodders/sourcemod/pull/2335) 的中文语言码修复**
            （该修复上游只在 1.13 / 1.12 有，1.11 至今没有）。

            | 下载 | 适用 SourceMod | 内含 |
            | --- | --- | --- |
            | `geoip-ext-1.11-dev.zip` | SourceMod 1.11 | `geoip.ext.so`（Linux）+ `geoip.ext.dll`（Windows） |
            | `geoip-ext-1.12-dev.zip` | SourceMod 1.12 | `geoip.ext.so`（Linux）+ `geoip.ext.dll`（Windows） |

            安装：把压缩包解压到服务端根目录（包内已按 `addons/sourcemod/extensions/` 组织）。

            还需自行准备 GeoIP 数据库 `GeoLite2-City.mmdb`，放到
            `addons/sourcemod/configs/geoip/`，详见仓库 README。

            校验和见 `SHA256SUMS.txt`。
